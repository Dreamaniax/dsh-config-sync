name: Runner probe

# One-off: which macOS labels can this account schedule? Deleted once answered.
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: uname -m && sw_vers && echo "ok: ${{ matrix.os }}"
