name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes the queued one instead of stacking macOS runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: node --test

      - name: Release hygiene gate
        run: node scripts/publish-check.mjs

      - name: Packaging smoke test
        run: node scripts/pack-smoke.mjs

  # Temporary probe: which macOS labels can this account schedule?
  probe:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: uname -m && sw_vers && echo "ok: ${{ matrix.os }}"
